<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>系统关系图谱</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">🕸</span>
      系统关系图谱
      <span class="sub">服务 · 代理 · 服务器 · 工具 · 关系台账</span>
    </div>
    <div class="toolbar">
      <span class="arch-label">架构</span>
      <select id="arch-select" title="切换架构"></select>
      <button class="btn" id="btn-arch-new" title="新建架构">＋</button>
      <button class="btn" id="btn-arch-rename" title="重命名当前架构">✎</button>
      <button class="btn" id="btn-arch-del" title="删除当前架构">🗑</button>
      <button class="btn" id="btn-arch-back" title="返回引用本架构的上层架构" style="display:none">← 返回上层</button>
      <input id="search" type="text" placeholder="搜索节点名称…" autocomplete="off" />
      <button class="btn" id="btn-add-node" title="新增一个节点（系统/服务/代理/服务器/工具/数据库）">＋ 添加节点</button>
      <button class="btn" id="btn-add-edge" title="在两个已有节点之间建立一条关系">⇄ 添加关系</button>
      <button class="btn" id="btn-table" title="以列表形式查看全部节点">☰ 列表</button>
      <button class="btn" id="btn-relayout" title="重新自动布局">↻ 重新布局</button>
      <button class="btn" id="btn-import" title="选择一个 data.json 文件，覆盖当前全部数据">⇪ 导入</button>
      <button class="btn" id="btn-export" title="下载 data.json 备份">⬇ 导出</button>
      <button class="btn" id="btn-theme" title="切换浅色/深色">🌙</button>
    </div>
  </header>

  <main class="stage">
    <div id="mount" class="graph"></div>
    <aside id="panel" class="panel"></aside>
  </main>

  <div id="legend" class="legend"></div>

  <div id="table-view" class="table-view hidden">
    <div class="tv-head">
      <b>全部节点</b>
      <button class="btn" id="tv-close">关闭</button>
    </div>
    <table>
      <thead>
        <tr><th>名称</th><th>类型</th><th>服务器</th><th>IP / 域名</th><th>责任人</th><th>说明</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="toast" class="toast"></div>

  <script src="vendor/g6.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
